<!doctype html><meta charset="utf-8"><title>RingMASTER</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161616}canvas{width:100%;height:100%;display:block}textarea{position:fixed;opacity:0;width:1px;height:1px;left:0;top:0}#status{position:fixed;top:0;right:0;color:#ffd080;background:#222;font:12px monospace;padding:2px 6px}#out{position:fixed;right:0;bottom:0;font:11px monospace;color:#aaa;background:#222;border:0;padding:2px 6px;opacity:.35;cursor:pointer}#out:hover,#out:focus{opacity:1}</style><canvas></canvas><textarea aria-label="Keyboard input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><div id="status">Connecting&#8230;</div><button id="out" type="button">Sign out</button><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),input=document.querySelector('textarea'),status=document.querySelector('#status');let ws,backoff=500,chain=Promise.resolve(),generation=0,stopped=false;
const ended='Session ended. Open a new login link from RingMASTER.';function stop(text){stopped=true;generation++;status.hidden=false;status.textContent=text}function retry(){if(stopped)return;setTimeout(connect,backoff);backoff=Math.min(15000,backoff*2)}
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}function resize(){canvas.width=Math.round(innerWidth*devicePixelRatio);canvas.height=Math.round(innerHeight*devicePixelRatio);send({t:'resize',w:innerWidth,h:innerHeight,dpr:devicePixelRatio})}
function connect(){if(stopped)return;const gen=++generation;ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/session`);ws.binaryType='arraybuffer';ws.onopen=()=>{backoff=500;status.hidden=true;resize();input.focus()};ws.onmessage=e=>{chain=chain.then(async()=>{if(gen!==generation)return;const v=new DataView(e.data),blob=new Blob([e.data.slice(16)],{type:'image/png'}),bitmap=await createImageBitmap(blob);if(gen===generation)ctx.drawImage(bitmap,v.getInt32(0),v.getInt32(4));bitmap.close()})};ws.onclose=e=>{if(stopped||gen!==generation)return;if(e.code>=4000&&e.code<4100){stop(e.reason||ended);return}status.hidden=false;status.textContent=e.code===1013?'Too many browser tabs are open · retrying…':'Disconnected · reconnecting…';fetch('/status',{cache:'no-store',credentials:'same-origin'}).then(r=>{if(r.status===403)stop(ended);else retry()},retry)}}
document.querySelector('#out').onclick=()=>{fetch('/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{}).finally(()=>{stop('Signed out. Open a new login link from RingMASTER.');ws?.close()})};
const mods=e=>({ctrl:e.ctrlKey,shift:e.shiftKey,alt:e.altKey,meta:e.metaKey});for(const [dom,kind] of [['pointermove','move'],['pointerdown','down'],['pointerup','up'],['pointerleave','leave']])canvas.addEventListener(dom,e=>{if(kind==='down'){input.focus();canvas.setPointerCapture(e.pointerId)}send({t:'pointer',kind,x:e.clientX,y:e.clientY,button:e.button,buttons:e.buttons,mods:mods(e)});e.preventDefault()});canvas.oncontextmenu=e=>e.preventDefault();canvas.addEventListener('wheel',e=>{const scale=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;send({t:'wheel',x:e.clientX,y:e.clientY,dx:e.deltaX*scale,dy:e.deltaY*scale,mode:0});e.preventDefault()},{passive:false});
for(const [dom,kind] of [['keydown','down'],['keyup','up']])input.addEventListener(dom,e=>{if(e.isComposing)return;send({t:'key',kind,key:e.key,code:e.code,mods:mods(e)});if(e.key.length!==1||e.ctrlKey||e.metaKey)e.preventDefault()});let composing=false;input.oncompositionstart=()=>composing=true;input.oncompositionend=e=>{composing=false;send({t:'text',text:e.data});input.value=''};input.oninput=e=>{if(!composing&&input.value){send({t:'text',text:input.value});input.value=''}};addEventListener('resize',resize);connect();
</script>
