name: Release

# A version tag (v0.24.0) builds the three packages from that tag and creates a draft release.
# Running the workflow by hand (Actions > Release > Run workflow) builds and tests without releasing.
# The update feed is signed offline afterwards; no signing key is ever given to this workflow (see RELEASING.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the version
        run: |
          version=$(sed -n 's/.*version = "\([0-9][0-9.]*\)".*/\1/p' build.gradle.kts | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"; exit 1
          fi
      - name: Test and package
        run: ./gradlew.bat :core:test :desktop:test :desktop:packageMsi --console=plain
      - name: Collect
        run: |
          # The Rust Bluetooth helper must be inside the installer; without cargo the build would quietly leave it out.
          test -f desktop/resources/windows/ringmaster-bt.exe || { echo "::error::Bluetooth helper was not built"; exit 1; }
          mkdir dist
          cp "desktop/build/compose/binaries/main/msi/ringmaster-$VERSION.msi" "dist/RingMASTER-$VERSION.msi"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-msi
          path: dist/
          if-no-files-found: error

  linux:
    name: ${{ matrix.label }} package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:13', platform: debian-13, label: Debian 13 }
          - { image: 'ubuntu:26.04', platform: ubuntu-26.04, label: Ubuntu 26.04 }
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-21-jdk fakeroot binutils dpkg-dev ca-certificates git fontconfig fonts-dejavu-core libgl1
      - uses: actions/checkout@v5
      - name: Read the version
        run: |
          version=$(sed -n 's/.*version = "\([0-9][0-9.]*\)".*/\1/p' build.gradle.kts | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"; exit 1
          fi
      - name: Test and package
        run: |
          chmod +x gradlew
          ./gradlew :core:test :desktop:test :desktop:packageDeb --console=plain
      - name: Collect
        run: |
          mkdir dist
          cp "desktop/build/compose/binaries/main/deb/ringmaster_${VERSION}_amd64.deb" "dist/ringmaster-${VERSION}-${{ matrix.platform }}-amd64.deb"
          dpkg-deb --field dist/*.deb Package Version Depends
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-amd64-deb
          path: dist/
          if-no-files-found: error

  release:
    name: Draft release
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # GitHub records these attestations for public repositories.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.msi
            dist/*.deb
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "RingMASTER ${GITHUB_REF_NAME#v}" \
            --notes "Draft. Before publishing: install and check each package, then add ringmaster-update.json and its .sig (see RELEASING.md)."
