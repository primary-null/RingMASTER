[package]
name = "ringmaster-engine"
version = "0.1.0"
edition = "2024"
description = "RingMASTER Engine: a read-only radio reporter installed inside a Linux guest or on a node"
license = "AGPL-3.0-only"
publish = false

# The smallest set that gives dependable HTTPS without a C library on the guest:
# - rustls: TLS 1.3 and 1.2 server, no OpenSSL, so one static binary runs on any distribution and in containers.
#   Only the ring provider, std and TLS 1.2; no logging, no webpki client verifier use, no default features.
# - ring: rustls' crypto provider, and also the key pair, signature, SHA-256 and random numbers the certificate and the
#   pairing token need, so no certificate or hashing crate is added.
# - libc: process groups (a scan's children are stopped with it), user ids and file modes. ring already depends on it.
# HTTP, JSON and the certificate's DER are written by hand: each is a few dozen lines for the fixed shapes used here.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
libc = "0.2"

# Small and static. Unlike the Windows helpers, panics unwind: a panic in one connection's thread must not stop the
# whole service.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
